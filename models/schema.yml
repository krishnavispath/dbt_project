models:
  - name: dim_listings_cleansed
    description: "Cleansed dimension table for Airbnb listings."
    data_tests:
      - minimum_row_count:
          min_row_count: 1000
          config:
            severity: error

    columns:
      - name: listing_id
        description: "Unique identifier for each listing."
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: "Unique identifier for each host. It references the dim_hosts_cleansed table."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id
              config:
                severity: warn

      - name: room_type
        description: "Type of room being offered."
        data_tests:
          - accepted_values:
              values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: "Cleansed dimension table for Airbnb hosts."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        data_type: integer
      - name: host_name
        description: "Name of the host."
        data_type: string
      - name: is_superhost
        description: "Indicates if the host is a superhost."
        data_type: string
      - name: created_at
        data_type: date
      - name: updated_at
        data_type: date